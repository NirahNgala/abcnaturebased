
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Crescendo Green</title>
    <style>
        :root {
            --green-1: #22c55e;
            --green-2: #16a34a;
            --blue-1: #06b6d4;
            --blue-2: #0891b2;
            --dark: #0f172a;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Satoshi', system-ui, sans-serif;
            background: linear-gradient(135deg, #abefd4 0%, #ffffff 100%);
            color: var(--light);
            line-height: 1.6;
        }

        header {
            background: rgba(3, 25, 72, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--green-1);
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--green-1);
        }


        .gallery-section {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .filter-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: rgb(0, 0, 0);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: linear-gradient(90deg, var(--green-1), var(--blue-1));
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 4 / 3;
        }

        .gallery-item:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 20px 40px rgba(34, 197, 94, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.12);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.95));
            padding: 2rem 1.5rem 1.5rem;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            max-width: 1000px;
            max-height: 90vh;
            position: relative;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .close {
            position: absolute;
            top: -20px;
            right: -20px;
            background: var(--green-1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        footer {
            background: #0a1421;
            padding: 3rem 2rem 2rem;
            text-align: center;
            margin-top: 6rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo"></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html" style="color: var(--green-1);">Gallery</a></li>
            </ul>
        </nav>
    </header>



    <section class="gallery-section">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="nurseries">Nurseries</button>
            <button class="filter-btn" data-filter="people">People</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="" loading="lazy">
            <div style="margin-top: 1rem; text-align: center; color: #94a3b8;">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

  <script>
    const images = [
        { 
            id: 1, 
            src: "ASSETS/Malia-vonski.webp", 
            category: "nature", 
            title: "Young Plantation", 
            desc: "Rows of young trees in the field" 
        },
        { 
            id: 2, 
            src: "ASSETS/seedlings.jpeg.webp", 
            category: "nurseries", 
            title: "Seedling Nursery", 
            desc: "Watering young plants in containers" 
        },
        { 
            id: 3, 
            src: "ASSETS/students.webp", 
            category: "people", 
            title: "Community Education", 
            desc: "Students and community members at the farm" 
        },
        { 
            id: 4, 
            src: "ASSETS/student.webp", 
            category: "people", 
            title: "Harvest Learning", 
            desc: "Students examining fresh produce" 
        },
        { 
            id: 5, 
            src: "ASSETS/mathilde-09.webp", 
            category: "nurseries", 
            title: "Nursery Work", 
            desc: "Women working with planting materials" 
        },
        { 
            id: 6, 
            src: "ASSETS/RiverKoromi.webp", 
            category: "nature", 
            title: "River Koromi", 
            desc: "Nearby water source for the farm" 
        },
        { 
            id: 7, 
            src: "ASSETS/Nursery.jpeg", 
            category: "nurseries", 
            title: "Organized Nursery", 
            desc: "Hundreds of healthy seedlings ready for planting" 
        },
        { 
            id: 8, 
            src: "ASSETS/Willy.webp", 
            category: "people", 
            title: "Willy at Koromi Farm", 
            desc: "Local team member with a friendly cat" 
        },
        { 
            id: 9, 
            src: "ASSETS/mathilde-08.webp", 
            category: "people", 
            title: "Field Team", 
            desc: "International and local volunteers working together" 
        },
        { 
            id: 10, 
            src: "ASSETS/grouppic.webp", 
            category: "people", 
            title: "The Full Team", 
            desc: "Group photo with the farm dog" 
        },
        { 
            id: 11, 
            src: "ASSETS/Working-10.webp", 
            category: "nurseries", 
            title: "Nursery Discussion", 
            desc: "Team planning in the nursery" 
        },
        { 
            id: 12, 
            src: "ASSETS/Working.webp", 
            category: "nurseries", 
            title: "Team Collaboration", 
            desc: "Discussing planting strategy" 
        },
        { 
            id: 13, 
            src: "ASSETS/mathilde-05.jpg.webp", 
            category: "nurseries", 
            title: "Loading Seedlings", 
            desc: "Preparing to transport young trees" 
        }
    ];

    function createGallery() {
        const grid = document.getElementById('galleryGrid');
        if (!grid) return;
        grid.innerHTML = '';

        images.forEach(img => {
            const item = document.createElement('div');
            item.className = `gallery-item`;
            item.dataset.category = img.category;
            
            item.innerHTML = `
                <img src="${img.src}" 
                     alt="${img.title}"
                     loading="lazy">
                <div class="overlay">
                    <h3>${img.title}</h3>
                    <p>${img.desc}</p>
                </div>
            `;

            item.addEventListener('click', () => showModal(img));
            grid.appendChild(item);
        });
    }

    function showModal(img) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImage');
        
        modalImg.src = img.src;
        document.getElementById('modalTitle').textContent = img.title;
        document.getElementById('modalDesc').textContent = img.desc;
        modal.style.display = 'flex';
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.dataset.filter;
            const items = document.querySelectorAll('.gallery-item');

            items.forEach(item => {
                item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
            });
        });
    });

    // Modal controls
    const closeModal = document.getElementById('closeModal');
    if (closeModal) {
        closeModal.addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
    }

    const modalElement = document.getElementById('modal');
    if (modalElement) {
        modalElement.addEventListener('click', (e) => {
            if (e.target === modalElement) {
                modalElement.style.display = 'none';
            }
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") {
            const modal = document.getElementById('modal');
            if (modal) modal.style.display = 'none';
        }
    });

    // Initialize gallery
    window.onload = createGallery;
</script>
</body>
</html>
