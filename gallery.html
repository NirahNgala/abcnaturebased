
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Crescendo Green</title>
    <style>
        :root {
            --green-1: #22c55e;
            --green-2: #16a34a;
            --blue-1: #06b6d4;
            --blue-2: #0891b2;
            --dark: #0f172a;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Satoshi', system-ui, sans-serif;
            background: linear-gradient(135deg, #abefd4 0%, #ffffff 100%);
            color: var(--light);
            line-height: 1.6;
        }
:root {
    --primary: #2e7d32;
    --green-1: #22c55e;
    --green-2: #16a34a;
    --blue-1: #06b6d4;
    --blue-2: #0891b2;
    --dark: #0f172a;
    --light: #ffffff;
}
         .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      z-index: 1000;
      transition: all 0.4s ease;
    }

    .navbar.scrolled {
      background: rgba(255, 255, 255, 0.99);
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 5%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo img {
      height: 60px;
      width: auto;
      display: block;
    }

    .nav-menu {
      display: flex;
      gap: 42px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-menu a {
      position: relative;
      text-decoration: none;
      color: #2e3f38;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.35s ease;
    }

    .nav-menu a:hover::after,
    .nav-menu a.active::after {
      width: 100%;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: var(--primary);
    }

    .nav-cta-btn {
      background: var(--primary);
      color: white;
      padding: 13px 26px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.4s ease;
    }

    .nav-cta-btn:hover {
      background: #1f5f24;
      transform: translateY(-3px);
    }

    .hamburger {
      width: 32px;
      height: 24px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .hamburger span {
      width: 100%;
      height: 3px;
      background: #183126;
      border-radius: 999px;
      transition: all 0.4s ease;
    }

    .gallery-section {
    max-width: 1400px;
    margin: 0 auto;
    padding: 140px 2rem 4rem;
}
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .filter-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: rgb(0, 0, 0);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: linear-gradient(90deg, var(--green-1), var(--blue-1));
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 4 / 3;
        }

        .gallery-item:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 20px 40px rgba(34, 197, 94, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.12);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.95));
            padding: 2rem 1.5rem 1.5rem;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            max-width: 1000px;
            max-height: 90vh;
            position: relative;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .close {
            position: absolute;
            top: -20px;
            right: -20px;
            background: var(--green-1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        footer {
            background: #0a1421;
            padding: 3rem 2rem 2rem;
            text-align: center;
            margin-top: 6rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
        /* MOBILE NAVIGATION */
@media (max-width: 768px) {

  .hamburger {
    display: flex;
    z-index: 1001;
  }

  .nav-cta {
    display: none;
  }

  .nav-menu {
    position: fixed;
    top: 90px;
    left: -100%;
    width: 100%;
    height: calc(100vh - 90px);
    background: white;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 35px;
    transition: left 0.4s ease;
    transform: none;
    z-index: 999;
  }

  .nav-menu.active {
    left: 0;
  }

  .nav-menu a {
    font-size: 1.2rem;
  }
}

/* Hamburger Animation */
.hamburger.active span:nth-child(1) {
  transform: rotate(45deg) translate(7px, 7px);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: rotate(-45deg) translate(7px, -7px);
}
    </style>
</head>
<body>

        <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <a href="index.html">
          <img src="ASSETS/Crescendologo.png" alt="Crescendo Green Logo">
        </a>
      </div>

      <div class="nav-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="blog.html">Blog</a>
      </div>

      <div class="nav-cta">
        <a href="contact.html" class="nav-cta-btn">Get in touch</a>
      </div>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>


    <section class="gallery-section">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="nurseries">Nurseries</button>
            <button class="filter-btn" data-filter="people">People</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="" loading="lazy">
            <div style="margin-top: 1rem; text-align: center; color: #94a3b8;">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

  <script>
    const images = [
        { 
            id: 1, 
            src: "ASSETS/Malia-vonski.webp", 
            category: "nature", 
            title: "Young Plantation", 
            desc: "Rows of young trees in the field" 
        },
        { 
            id: 2, 
            src: "ASSETS/seedlings.jpeg.webp", 
            category: "nurseries", 
            title: "Seedling Nursery", 
            desc: "Watering young plants in containers" 
        },
        { 
            id: 3, 
            src: "ASSETS/students.webp", 
            category: "people", 
            title: "Community Education", 
            desc: "Students and community members at the farm" 
        },
        { 
            id: 4, 
            src: "ASSETS/student.webp", 
            category: "people", 
            title: "Harvest Learning", 
            desc: "Students examining fresh produce" 
        },
        { 
            id: 5, 
            src: "ASSETS/mathilde-09.webp", 
            category: "nurseries", 
            title: "Nursery Work", 
            desc: "Women working with planting materials" 
        },
        { 
            id: 6, 
            src: "ASSETS/RiverKoromi.webp", 
            category: "nature", 
            title: "River Koromi", 
            desc: "Nearby water source for the farm" 
        },
        { 
            id: 7, 
            src: "ASSETS/Nursery.jpeg", 
            category: "nurseries", 
            title: "Organized Nursery", 
            desc: "Hundreds of healthy seedlings ready for planting" 
        },
        { 
            id: 8, 
            src: "ASSETS/Willy.webp", 
            category: "people", 
            title: "Willy at Koromi Farm", 
            desc: "Local team member with a friendly cat" 
        },
        { 
            id: 9, 
            src: "ASSETS/mathilde-08.webp", 
            category: "people", 
            title: "Field Team", 
            desc: "International and local volunteers working together" 
        },
        { 
            id: 10, 
            src: "ASSETS/grouppic.webp", 
            category: "people", 
            title: "The Full Team", 
            desc: "Group photo with the farm dog" 
        },
        { 
            id: 11, 
            src: "ASSETS/Working-10.webp", 
            category: "nurseries", 
            title: "Nursery Discussion", 
            desc: "Team planning in the nursery" 
        },
        { 
            id: 12, 
            src: "ASSETS/NurseryDroneView.webp", 
            category: "nurseries", 
            title: "Mtwapa Nursery", 
            desc: "Aerial view of the nursery layout" 
        },
        { 
            id: 13, 
            src: "ASSETS/nurseryatnight.webp", 
            category: "nurseries", 
            title: "Mtwapa Nursery at Night", 
            desc: "Preparing to transport young trees" 
        },
         { 
            id: 14, 
            src: "ASSETS/nurseryvisit.webp", 
            category: "nurseries", 
            title: "Nursery Visit", 
            desc: "Team visiting a local nursery to learn best practices" 
        }
    ];

    function createGallery() {
        const grid = document.getElementById('galleryGrid');
        if (!grid) return;
        grid.innerHTML = '';

        images.forEach(img => {
            const item = document.createElement('div');
            item.className = `gallery-item`;
            item.dataset.category = img.category;
            
            item.innerHTML = `
                <img src="${img.src}" 
                     alt="${img.title}"
                     loading="lazy">
                <div class="overlay">
                    <h3>${img.title}</h3>
                    <p>${img.desc}</p>
                </div>
            `;

            item.addEventListener('click', () => showModal(img));
            grid.appendChild(item);
        });
    }

    function showModal(img) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImage');
        
        modalImg.src = img.src;
        document.getElementById('modalTitle').textContent = img.title;
        document.getElementById('modalDesc').textContent = img.desc;
        modal.style.display = 'flex';
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.dataset.filter;
            const items = document.querySelectorAll('.gallery-item');

            items.forEach(item => {
                item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
            });
        });
    });

    // Modal controls
    const closeModal = document.getElementById('closeModal');
    if (closeModal) {
        closeModal.addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
    }

    const modalElement = document.getElementById('modal');
    if (modalElement) {
        modalElement.addEventListener('click', (e) => {
            if (e.target === modalElement) {
                modalElement.style.display = 'none';
            }
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") {
            const modal = document.getElementById('modal');
            if (modal) modal.style.display = 'none';
        }
    });

    // Initialize gallery
    window.onload = createGallery;
</script>
  <script>
// Hamburger Menu - Full Screen Fix
const hamburger = document.querySelector('.hamburger');
const navMenu = document.querySelector('.nav-menu');

hamburger.addEventListener('click', () => {
  const isActive = navMenu.classList.toggle('active');
  hamburger.classList.toggle('active');
  
  if (isActive) {
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = 'visible';
  }
});

// Close menu when clicking a link
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.addEventListener('click', () => {
    hamburger.classList.remove('active');
    navMenu.classList.remove('active');
    document.body.style.overflow = 'visible';
  });
});
</script>
</body>
</html>
